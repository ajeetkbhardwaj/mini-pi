[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-pi"
version = "0.1.0"
description = "A minimal, modular coding agent inspired by Pi in Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "mini-pi contributors" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
    "httpx>=0.24.0",
    "anthropic>=0.20.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
mini-pi = "mini_pi.cli:cli_entry"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_pi"]
